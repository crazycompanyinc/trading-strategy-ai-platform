name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    
    env:
      CI: false
      GENERATE_SOURCEMAP: false
      ELECTRON_BUILDER_CACHE: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        shell: cmd
        timeout-minutes: 15

      - name: Build React app
        working-directory: ./frontend
        run: npx react-scripts build
        shell: cmd
        timeout-minutes: 10

      - name: Install dev dependencies (electron-builder)
        working-directory: ./frontend
        run: npm install electron electron-builder --save-dev --legacy-peer-deps --no-audit --no-fund
        shell: cmd
        timeout-minutes: 10

      - name: Build Windows installer (NSIS)
        working-directory: ./frontend
        run: npx electron-builder --win nsis
        shell: cmd
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: frontend/dist/*.exe
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
