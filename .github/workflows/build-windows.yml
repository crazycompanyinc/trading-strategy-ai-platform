name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: false
      GENERATE_SOURCEMAP: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: ./frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        shell: cmd
        timeout-minutes: 20

      - name: Build React
        working-directory: ./frontend
        run: npx react-scripts build
        shell: cmd
        timeout-minutes: 15

      - name: Build Electron (zip)
        working-directory: ./frontend
        run: npx electron-builder --win zip
        shell: cmd
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        working-directory: ./frontend
        run: dir dist\
        shell: cmd

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: frontend/dist/*
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/dist/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
