name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React app
        working-directory: ./frontend
        run: npx react-scripts build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Build Electron installer (NSIS)
        working-directory: ./frontend
        run: npx electron-builder --win nsis --publish never
        env:
          CI: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron portable
        working-directory: ./frontend
        run: npx electron-builder --win portable --publish never
        env:
          CI: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: TradingStrategyAI-Setup
          path: frontend/dist/*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: TradingStrategyAI-Portable
          path: frontend/dist/*Portable*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            frontend/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
